server:
  port: ${ADMIN_PORT:8080}
  address: ${ADMIN_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mock:
  wiremock-port: ${WIREMOCK_PORT:9090}
  # Every subdirectory of this folder becomes an endpoint: <folder> -> GET /<folder>, header X-<Folder>-Ref
  data-directory: ${MOCK_DATA_DIR:./mock-data}
