server:
  port: ${ADMIN_PORT:8080}
  address: ${ADMIN_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

mock:
  wiremock-port: ${WIREMOCK_PORT:9090}
  data-directory: ${MOCK_DATA_DIR:./mock-data}
  domains:
    product:
      path: /products
      selector-header: X-Product-Ref
      response-folder: products
    customer:
      path: /customers
      selector-header: X-Customer-Ref
      response-folder: customers
    order:
      path: /orders
      selector-header: X-Order-Ref
      response-folder: orders
    category:
      path: /categories
      selector-header: X-Category-Ref
      response-folder: categories
